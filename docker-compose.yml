version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000
      - MODEL_DIR=/app/models
    volumes:
      - ./backend/models:/app/models:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:7860
      - DATABASE_URL=
    depends_on:
      - backend
